<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D 당구 시스템 & 물리 시뮬레이터 (WebGL)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #111; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #app-container { display: flex; width: 100vw; height: 100vh; }
        #viewport { flex: 1; position: relative; }
        #canvas3d { width: 100%; height: 100%; display: block; }
        
        /* Control Panel Sidebar */
        #sidebar { width: 340px; background: #1e1e1e; padding: 20px; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        h2 { font-size: 18px; color: #2ecc71; border-bottom: 2px solid #2ecc71; padding-bottom: 5px; }
        .group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; }
        select, input[type="range"] { width: 100%; padding: 6px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        .val-disp { font-size: 11px; color: #3498db; text-align: right; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-shoot { background: #27ae60; color: white; }
        .btn-shoot:hover { background: #2ecc71; }
        .btn-reset { background: #e74c3c; color: white; }
        .btn-reset:hover { background: #c0392b; }
        .btn-clear { background: #f39c12; color: white; }
        
        /* Overlay HUD */
        #hud-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75); padding: 15px; border-radius: 8px; border: 1px solid #444; pointer-events: none; max-width: 380px; }
        #hud-overlay h3 { font-size: 14px; color: #f1c40f; margin-bottom: 6px; }
        #hud-overlay p { font-size: 12px; line-height: 1.4; color: #ddd; }
        .formula { font-family: monospace; color: #2ecc71; font-weight: bold; }
    </style>
    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app-container">
    <div id="viewport">
        <canvas id="canvas3d"></canvas>
        <div id="hud-overlay">
            <h3 id="sysTitle">파이브 앤 하프 시스템 (Five & Half)</h3>
            <p id="sysFormula">공식: <span class="formula">1쿠션 = 수구 수 - 3쿠션 수</span></p>
            <p id="sysCalc" style="margin-top:5px; font-size:11px; color:#aaa;">이론 가이드라인(황색 점선)과 실제 물리 궤적(녹색 실선)을 비교하세요.</p>
        </div>
    </div>

    <div id="sidebar">
        <h2>🎱 3D 당구 물리 시뮬레이터</h2>
        
        <div class="group">
            <label for="tableType">당구대 규격</label>
            <select id="tableType" onchange="changeTableType()">
                <option value="daeda">국제경쟁용 대대 (10-foot, 3구)</option>
                <option value="joongdae">일반 중대 (9-foot, 4구)</option>
            </select>
        </div>

        <div class="group">
            <label for="systemMode">적용 당구 시스템 (Guide Layer)</label>
            <select id="systemMode" onchange="updateSystemHUD()">
                <option value="fiveHalf">파이브 앤 하프 시스템 (3뱅크)</option>
                <option value="plus">플러스 시스템 (단-장-단)</option>
                <option value="ballSystem">볼퍼스트 옆돌리기 (Ball System)</option>
                <option value="noSpin">무회전 / 좁은각 단쿠션 시스템</option>
            </select>
        </div>

        <hr style="border-color:#333;">

        <div class="group">
            <label>스트로크 세기 (Power): <span id="powVal" class="val-disp">15 m/s</span></label>
            <input type="range" id="power" min="5" max="30" value="15" oninput="document.getElementById('powVal').innerText=this.value+' m/s'">
        </div>

        <div class="group">
            <label>좌우 회전 (Side Spin): <span id="spinXVal" class="val-disp">0 Tip</span></label>
            <input type="range" id="spinX" min="-4" max="4" value="0" step="0.5" oninput="document.getElementById('spinXVal').innerText=this.value+' Tip'">
        </div>

        <div class="group">
            <label>상하 회전 (Top/Bottom Spin): <span id="spinYVal" class="val-disp">0 (무회전)</span></label>
            <input type="range" id="spinY" min="-4" max="4" value="0" step="0.5" oninput="updateSpinLabel(this.value)">
        </div>

        <div class="group">
            <label>조준 각도 (Aim Angle): <span id="angleVal" class="val-disp">0°</span></label>
            <input type="range" id="aimAngle" min="0" max="360" value="35" oninput="document.getElementById('angleVal').innerText=this.value+'°'; updateAimLine();">
        </div>

        <div class="btn-group">
            <button class="btn-shoot" onclick="shoot()">샷 실행</button>
            <button class="btn-reset" onclick="resetBalls()">위치 리셋</button>
        </div>
        <div class="btn-group">
            <button class="btn-clear" onclick="clearTrails()">궤적 잔상 지우기</button>
        </div>
    </div>
</div>

<script>
// --- Three.js 글로벌 변수 설정 ---
let scene, camera, renderer, controls;
let tableMesh, cushionMesh;
let cueBall, objectBall1, objectBall2;
let cueStick;
let aimLine, theoryLine;
let ballTrails = []; // 궤적 잔상 저장 배열

// 당구대 환경 규격 변수
let tableSpec = { width: 28.44, height: 14.22, ballR: 0.3075, friction: 0.991, cushionElasticity: 0.82 };
let isSimulating = false;

function init3D() {
    const viewport = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 30, 25);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.shadowMap.enabled = true;

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // 바닥 아래로 카메라 이동 방지

    // 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 50, 0);
    dirLight.castShadow = true;
    scene.add(dirLight);

    buildTable();
    createBalls();
    createCueStick();
    createAimLines();

    window.addEventListener('resize', onWindowResize);
    updateSystemHUD();
    animate();
}

// --- 당구대 3D 모델링 ---
function buildTable() {
    if(tableMesh) scene.remove(tableMesh);

    const w = tableSpec.width;
    const h = tableSpec.height;

    // 천 (Felt) - 초록색/파란색 라사지
    const feltGeo = new THREE.BoxGeometry(w, 0.5, h);
    const feltMat = new THREE.MeshStandardMaterial({ color: 0x0f6b38, roughness: 0.6 });
    tableMesh = new THREE.Mesh(feltGeo, feltMat);
    tableMesh.position.y = -0.25;
    tableMesh.receiveShadow = true;
    scene.add(tableMesh);

    // 원목 쿠션 프레임
    const frameGeo = new THREE.BoxGeometry(w + 3, 0.8, h + 3);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.3 });
    const frameMesh = new THREE.Mesh(frameGeo, frameMat);
    frameMesh.position.y = -0.4;
    scene.add(frameMesh);

    // 다이아몬드 포인트 마크 생성
    createDiamonds(w, h);
}

function createDiamonds(w, h) {
    const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pGeo = new THREE.SphereGeometry(0.12, 8, 8);

    // 장쿠션/단쿠션 분할 포인트 배치
    for(let i = 1; i < 8; i++) {
        let x = -w/2 + (w/8) * i;
        let p1 = new THREE.Mesh(pGeo, pMat); p1.position.set(x, 0.01, h/2 + 0.6); scene.add(p1);
        let p2 = new THREE.Mesh(pGeo, pMat); p2.position.set(x, 0.01, -h/2 - 0.6); scene.add(p2);
    }
    for(let j = 1; j < 4; j++) {
        let z = -h/2 + (h/4) * j;
        let p1 = new THREE.Mesh(pGeo, pMat); p1.position.set(w/2 + 0.6, 0.01, z); scene.add(p1);
        let p2 = new THREE.Mesh(pGeo, pMat); p2.position.set(-w/2 - 0.6, 0.01, z); scene.add(p2);
    }
}

// --- 공 생성 ---
function createBalls() {
    const r = tableSpec.ballR;
    const ballGeo = new THREE.SphereGeometry(r, 32, 32);

    cueBall = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }));
    objectBall1 = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: 0xdd2c00, roughness: 0.1 }));
    objectBall2 = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: 0xffd600, roughness: 0.1 }));

    [cueBall, objectBall1, objectBall2].forEach(b => {
        b.castShadow = true;
        b.userData = { vx: 0, vz: 0, spinX: 0, spinY: 0 };
        scene.add(b);
    });

    resetBalls();
}

function createCueStick() {
    const stickGeo = new THREE.CylinderGeometry(0.08, 0.2, 15, 16);
    const stickMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
    cueStick = new THREE.Mesh(stickGeo, stickMat);
    cueStick.rotation.x = Math.PI / 2;
    scene.add(cueStick);
}

function createAimLines() {
    // 실제 조준선
    const aimGeo = new THREE.BufferGeometry();
    const aimMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.5, gapSize: 0.2 });
    aimLine = new THREE.Line(aimGeo, aimMat);
    scene.add(aimLine);

    // 이론 가이드 라인 (Yellow)
    const theoryGeo = new THREE.BufferGeometry();
    const theoryMat = new THREE.LineBasicMaterial({ color: 0xf1c40f });
    theoryLine = new THREE.Line(theoryGeo, theoryMat);
    scene.add(theoryLine);
}

function resetBalls() {
    isSimulating = false;
    const w = tableSpec.width;
    const h = tableSpec.height;

    cueBall.position.set(-w/4, tableSpec.ballR, h/4);
    objectBall1.position.set(w/4, tableSpec.ballR, -h/6);
    objectBall2.position.set(w/3, tableSpec.ballR, h/3);

    [cueBall, objectBall1, objectBall2].forEach(b => {
        b.userData.vx = 0;
        b.userData.vz = 0;
    });

    updateAimLine();
}

function updateAimLine() {
    if (isSimulating) {
        cueStick.visible = false;
        aimLine.visible = false;
        theoryLine.visible = false;
        return;
    }

    const angleDeg = parseFloat(document.getElementById('aimAngle').value);
    const rad = (angleDeg * Math.PI) / 180;

    // 큐대 위치 설정
    cueStick.visible = true;
    const dist = 9;
    cueStick.position.set(cueBall.position.x - Math.cos(rad) * dist, tableSpec.ballR + 0.3, cueBall.position.z - Math.sin(rad) * dist);
    cueStick.rotation.y = -rad + Math.PI/2;

    // 조준선 렌더링
    aimLine.visible = true;
    const points = [
        cueBall.position.clone(),
        new THREE.Vector3(cueBall.position.x + Math.cos(rad) * 40, tableSpec.ballR, cueBall.position.z + Math.sin(rad) * 40)
    ];
    aimLine.geometry.setFromPoints(points);
    aimLine.computeLineDistances();

    calculateTheoreticalPath(rad);
}

// --- 이론 시스템 가이드선 계산 ---
function calculateTheoreticalPath(rad) {
    theoryLine.visible = true;
    const p0 = cueBall.position.clone();
    const mode = document.getElementById('systemMode').value;
    let tPoints = [p0];

    // 단순 입사각/반사각 거울 반사 기하 궤적 (기본 3쿠션 라인 가이드)
    let curr = p0.clone();
    let dir = new THREE.Vector3(Math.cos(rad), 0, Math.sin(rad)).normalize();
    let remainingDist = 60;

    for (let bounce = 0; bounce < 3; bounce++) {
        let hit = findCushionIntersection(curr, dir);
        if (hit) {
            tPoints.push(hit.point);
            curr = hit.point.clone();
            dir.reflect(hit.normal); // 완전 반사
        }
    }
    theoryLine.geometry.setFromPoints(tPoints);
}

function findCushionIntersection(origin, dir) {
    const w = tableSpec.width / 2 - tableSpec.ballR;
    const h = tableSpec.height / 2 - tableSpec.ballR;
    let tMin = Infinity;
    let normal = new THREE.Vector3();

    if (dir.x > 0) { let t = (w - origin.x) / dir.x; if(t > 0 && t < tMin) { tMin = t; normal.set(-1, 0, 0); } }
    if (dir.x < 0) { let t = (-w - origin.x) / dir.x; if(t > 0 && t < tMin) { tMin = t; normal.set(1, 0, 0); } }
    if (dir.z > 0) { let t = (h - origin.z) / dir.z; if(t > 0 && t < tMin) { tMin = t; normal.set(0, 0, -1); } }
    if (dir.z < 0) { let t = (-h - origin.z) / dir.z; if(t > 0 && t < tMin) { tMin = t; normal.set(0, 0, 1); } }

    if (tMin < Infinity) {
        return { point: origin.clone().add(dir.clone().multiplyScalar(tMin)), normal: normal };
    }
    return null;
}

// --- 샷 실행 및 물리 루프 ---
function shoot() {
    if (isSimulating) return;

    const power = parseFloat(document.getElementById('power').value) * 0.08;
    const angleDeg = parseFloat(document.getElementById('aimAngle').value);
    const rad = (angleDeg * Math.PI) / 180;

    cueBall.userData.vx = Math.cos(rad) * power;
    cueBall.userData.vz = Math.sin(rad) * power;
    cueBall.userData.spinX = parseFloat(document.getElementById('spinX').value);
    cueBall.userData.spinY = parseFloat(document.getElementById('spinY').value);

    isSimulating = true;
    updateAimLine();
}

function updatePhysics() {
    if (!isSimulating) return;

    const balls = [cueBall, objectBall1, objectBall2];
    let stillMoving = false;

    balls.forEach(ball => {
        let vX = ball.userData.vx;
        let vZ = ball.userData.vz;

        if (Math.hypot(vX, vZ) > 0.001) {
            stillMoving = true;

            // 궤적 잔상 생성 (Trail Trace)
            createTrailPoint(ball.position.clone(), ball.material.color);

            ball.position.x += vX;
            ball.position.z += vZ;

            // 마찰 감쇄
            ball.userData.vx *= tableSpec.friction;
            ball.userData.vz *= tableSpec.friction;

            // 상하 당점(SpinY) 커브 현상 (Follow/Draw)
            if (ball === cueBall && Math.hypot(vX, vZ) > 0.1) {
                const spinY = ball.userData.spinY;
                ball.userData.vx += (spinY * 0.0015) * Math.cos(parseFloat(document.getElementById('aimAngle').value) * Math.PI/180);
                ball.userData.vz += (spinY * 0.0015) * Math.sin(parseFloat(document.getElementById('aimAngle').value) * Math.PI/180);
            }

            // 쿠션 충돌 처리
            const wBoundary = tableSpec.width/2 - tableSpec.ballR;
            const hBoundary = tableSpec.height/2 - tableSpec.ballR;

            if (Math.abs(ball.position.x) > wBoundary) {
                ball.position.x = Math.sign(ball.position.x) * wBoundary;
                ball.userData.vx = -ball.userData.vx * tableSpec.cushionElasticity;
                ball.userData.vz += ball.userData.spinX * 0.03; // 회전에 의한 굴절
            }
            if (Math.abs(ball.position.z) > hBoundary) {
                ball.position.z = Math.sign(ball.position.z) * hBoundary;
                ball.userData.vz = -ball.userData.vz * tableSpec.cushionElasticity;
                ball.userData.vx -= ball.userData.spinX * 0.03;
            }
        } else {
            ball.userData.vx = 0;
            ball.userData.vz = 0;
        }
    });

    // 공간 탄성 충돌
    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            checkBallCollision(balls[i], balls[j]);
        }
    }

    if (!stillMoving) isSimulating = false;
}

function checkBallCollision(b1, b2) {
    const dx = b2.position.x - b1.position.x;
    const dz = b2.position.z - b1.position.z;
    const dist = Math.hypot(dx, dz);
    const minDist = tableSpec.ballR * 2;

    if (dist < minDist) {
        const angle = Math.atan2(dz, dx);
        const sin = Math.sin(angle), cos = Math.cos(angle);

        let vx1 = b1.userData.vx * cos + b1.userData.vz * sin;
        let vz1 = b1.userData.vz * cos - b1.userData.vx * sin;
        let vx2 = b2.userData.vx * cos + b2.userData.vz * sin;
        let vz2 = b2.userData.vz * cos - b2.userData.vx * sin;

        let finalVx1 = vx2;
        let finalVx2 = vx1;

        b1.userData.vx = finalVx1 * cos - vz1 * sin;
        b1.userData.vz = vz1 * cos + finalVx1 * sin;
        b2.userData.vx = finalVx2 * cos - vz2 * sin;
        b2.userData.vz = vz2 * cos + finalVx2 * sin;

        // 위치 보정
        const overlap = minDist - dist;
        b1.position.x -= Math.cos(angle) * overlap / 2;
        b1.position.z -= Math.sin(angle) * overlap / 2;
        b2.position.x += Math.cos(angle) * overlap / 2;
        b2.position.z += Math.sin(angle) * overlap / 2;
    }
}

// --- 궤적 잔상 (Trail Trace) ---
function createTrailPoint(pos, color) {
    const pGeo = new THREE.SphereGeometry(0.06, 8, 8);
    const pMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    pMesh.position.copy(pos);
    scene.add(pMesh);
    ballTrails.push(pMesh);

    if (ballTrails.length > 400) {
        scene.remove(ballTrails.shift());
    }
}

function clearTrails() {
    ballTrails.forEach(p => scene.remove(p));
    ballTrails = [];
}

// --- UI 및 HUD 업데이트 ---
function updateSystemHUD() {
    const mode = document.getElementById('systemMode').value;
    const titleEl = document.getElementById('sysTitle');
    const formEl = document.getElementById('sysFormula');

    if (mode === 'fiveHalf') {
        titleEl.innerText = "파이브 앤 하프 시스템 (Five & Half)";
        formEl.innerHTML = '공식: <span class="formula">1쿠션 = 수구 수 - 3쿠션 수</span>';
    } else if (mode === 'plus') {
        titleEl.innerText = "플러스 시스템 (Plus System)";
        formEl.innerHTML = '공식: <span class="formula">1쿠션 = 수구 수 + 3쿠션 수</span>';
    } else if (mode === 'ballSystem') {
        titleEl.innerText = "볼퍼스트 옆돌리기 (Ball System)";
        formEl.innerHTML = '공식: <span class="formula">두께 + 회전(팁) = 목적구 수 + 기울기</span>';
    } else if (mode === 'noSpin') {
        titleEl.innerText = "무회전 / 좁은각 단쿠션 시스템";
        formEl.innerHTML = '공식: <span class="formula">입사각 : 반사각 = 1 : 1 대칭</span>';
    }
    updateAimLine();
}

function changeTableType() {
    const type = document.getElementById('tableType').value;
    if (type === 'daeda') {
        tableSpec = { width: 28.44, height: 14.22, ballR: 0.3075, friction: 0.991, cushionElasticity: 0.82 };
    } else {
        tableSpec = { width: 24.4, height: 12.2, ballR: 0.3275, friction: 0.984, cushionElasticity: 0.73 };
    }
    buildTable();
    resetBalls();
}

function updateSpinLabel(val) {
    let txt = val + " Tip";
    if (val > 0) txt += " (상단/Follow)";
    else if (val < 0) txt += " (하단/Draw)";
    else txt = "0 (무회전)";
    document.getElementById('spinYVal').innerText = txt;
}

function onWindowResize() {
    const viewport = document.getElementById('viewport');
    camera.aspect = viewport.clientWidth / viewport.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
}

function animate() {
    requestAnimationFrame(animate);
    updatePhysics();
    controls.update();
    renderer.render(scene, camera);
}

// 초기화 실행
init3D();
</script>
</body>
</html>
