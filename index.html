<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 당구 물리 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #111; color: #fff; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #app-container { display: flex; width: 100%; height: 100%; }
        #viewport { flex: 1; position: relative; height: 100%; min-width: 300px; background-color: #050505; cursor: grab; }
        #viewport:active { cursor: grabbing; }
        #canvas3d { width: 100%; height: 100%; display: block; }
        
        #sidebar { width: 340px; background: #1e1e1e; padding: 20px; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; z-index: 20; }
        h2 { font-size: 18px; color: #2ecc71; border-bottom: 2px solid #2ecc71; padding-bottom: 5px; }
        .group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; }
        select, input[type="range"] { width: 100%; padding: 6px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        .val-disp { font-size: 11px; color: #3498db; text-align: right; }
        .thick-disp { font-size: 12px; color: #f1c40f; font-weight: bold; text-align: right; }
        .btn-group { display: flex; gap: 6px; margin-top: 4px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .btn-fine { padding: 6px; font-size: 11px; background: #333; color: #2ecc71; border: 1px solid #444; }
        .btn-fine:hover { background: #444; color: #2ecc71; }
        .btn-shoot { background: #27ae60; color: white; }
        .btn-replay { background: #8e44ad; color: white; }
        .btn-replay:hover:not(:disabled) { background: #9b59b6; }
        .btn-reset { background: #e67e22; color: white; }
        .btn-reset:hover { background: #d35400; }
        .btn-repeat { background: #2980b9; color: white; }
        .btn-repeat:hover { background: #3498db; }
        .btn-clear { background: #7f8c8d; color: white; }
        
        #hud-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; border: 1px solid #444; pointer-events: none; max-width: 360px; z-index: 10; }
        #hud-overlay h3 { font-size: 14px; color: #f1c40f; margin-bottom: 4px; }
        #hud-overlay p { font-size: 12px; color: #ddd; }
        .formula { font-family: monospace; color: #2ecc71; font-weight: bold; }
        .guide-text { font-size: 11px; color: #3498db; margin-top: 6px; line-height: 1.4; }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app-container">
    <div id="viewport">
        <canvas id="canvas3d"></canvas>
        <div id="hud-overlay">
            <h3 id="sysTitle">파이브 앤 하프 시스템</h3>
            <p id="sysFormula">공식: <span class="formula">1쿠션 = 수구 수 - 3쿠션 수</span></p>
            <p class="guide-text">
                👉 <b>드래그 (손가락/마우스 이동)</b>: 당구대 시점 회전<br>
                🎯 <b>짧은 터치/클릭</b>: 목적구 조준<br>
                🔍 <b>미세 버튼</b>: 0.1° / 0.5° 단위 정밀 겨냥
            </p>
        </div>
    </div>

    <div id="sidebar">
        <h2>🎱 3D 당구 시뮬레이터</h2>
        
        <div class="group">
            <label for="gameMode">게임 종목 선택</label>
            <select id="gameMode" onchange="changeGameMode()">
                <option value="3ball">3구 쓰리쿠션 (공 3개 / 61.5mm)</option>
                <option value="4ball">4구 당구 (공 4개 / 65.5mm)</option>
            </select>
        </div>

        <div class="group">
            <label for="tableType">당구대 규격</label>
            <select id="tableType" onchange="changeTableType()">
                <option value="daeda">국제경쟁용 대대 (10-foot)</option>
                <option value="joongdae">일반 중대 (9-foot)</option>
            </select>
        </div>

        <div class="group">
            <label for="systemMode">적용 시스템</label>
            <select id="systemMode" onchange="updateSystemHUD()">
                <option value="fiveHalf">파이브 앤 하프 시스템</option>
                <option value="plus">플러스 시스템</option>
                <option value="ballSystem">볼퍼스트 (옆돌리기)</option>
                <option value="noSpin">무회전 시스템</option>
            </select>
        </div>

        <div class="group">
            <label>스트로크 세기: <span id="powVal" class="val-disp">15 m/s (2레일 세기)</span></label>
            <input type="range" id="power" min="5" max="30" value="15" oninput="updatePowerLabel(this.value)">
        </div>

        <div class="group">
            <label>좌우 회전 (Side Spin): <span id="spinXVal" class="val-disp">0 Tip (중앙)</span></label>
            <input type="range" id="spinX" min="-4" max="4" value="0" step="0.5" oninput="updateSpinXLabel(this.value)">
        </div>

        <div class="group">
            <label>상하 회전 (Top/Bottom): <span id="spinYVal" class="val-disp">0 Tip (중앙)</span></label>
            <input type="range" id="spinY" min="-4" max="4" value="0" step="0.5" oninput="updateSpinYLabel(this.value)">
        </div>

        <div class="group">
            <label>조준 각도: <span id="angleVal" class="val-disp">35.0°</span></label>
            <input type="range" id="aimAngle" min="0" max="360" value="35.0" step="0.1" oninput="updateAngleLabel(this.value); updateAimLine();">
            <div class="btn-group">
                <button class="btn-fine" onclick="adjustAngle(-0.5)">◀ -0.5°</button>
                <button class="btn-fine" onclick="adjustAngle(-0.1)">◀ -0.1°</button>
                <button class="btn-fine" onclick="adjustAngle(0.1)">+0.1° ▶</button>
                <button class="btn-fine" onclick="adjustAngle(0.5)">+0.5° ▶</button>
            </div>
        </div>

        <div class="group" style="background: #252525; padding: 8px; border-radius: 4px; border: 1px solid #333;">
            <label>🎯 겨냥 목적구 & 두께:</label>
            <span id="thicknessVal" class="thick-disp">계산 중...</span>
        </div>

        <div class="btn-group">
            <button class="btn-shoot" onclick="shoot()">샷 실행</button>
            <button class="btn-replay" id="btnReplay" onclick="playSlowReplay()" disabled>🎬 슬로우 (0.3x)</button>
        </div>
        <div class="btn-group">
            <button class="btn-reset" onclick="resetBalls(true)">🎲 랜덤 배치</button>
            <button class="btn-repeat" onclick="resetBalls(false)">🔄 동일 배치 반복</button>
        </div>
        <div class="btn-group">
            <button class="btn-clear" onclick="clearTrails()">궤적 잔상 지우기</button>
        </div>
    </div>
</div>

<script>
let scene, camera, renderer, controls;
let tableGroup, cuePivot, cueGroup, aimLine, theoryLine;
let cueBall, objectBall1, objectBall2, objectBall3;
let balls = [];
let ballTrails = [];

let savedBallPositions = [];
let recordedFrames = [];
let isReplaying = false;
let replayFrameIdx = 0;
const REPLAY_SPEED = 0.3;

let currentGameMode = '3ball';
let tableSpec = { width: 28.44, height: 14.22, ballR: 0.3075, friction: 0.991, cushionElasticity: 0.82 };
let isSimulating = false;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

let pointerStartX = 0;
let pointerStartY = 0;

function init3D() {
    const viewport = document.getElementById('viewport');
    const width = viewport.clientWidth || (window.innerWidth - 340);
    const height = viewport.clientHeight || window.innerHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
    camera.position.set(0, 25, 30);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    if (typeof THREE.OrbitControls !== 'undefined') {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 40, 20);
    scene.add(dirLight);

    buildTable();
    createCueStick();   
    createAimLines();   
    createBalls();      

    viewport.addEventListener('pointerdown', onPointerDown);
    viewport.addEventListener('pointerup', onPointerUp);

    window.addEventListener('resize', onWindowResize);
    
    updatePowerLabel(document.getElementById('power').value);
    updateSpinXLabel(document.getElementById('spinX').value);
    updateSpinYLabel(document.getElementById('spinY').value);
    updateAngleLabel(document.getElementById('aimAngle').value);
    updateSystemHUD();
    
    animate();
}

function buildTable() {
    if(tableGroup) scene.remove(tableGroup);
    tableGroup = new THREE.Group();

    const w = tableSpec.width, h = tableSpec.height;
    const cushionThick = 0.6;
    const woodThick = 1.2;
    const heightLevel = 0.5;

    const feltMat = new THREE.MeshStandardMaterial({ color: 0x1e824c, roughness: 0.4 });
    const feltBed = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, h), feltMat);
    feltBed.position.y = -0.1;
    tableGroup.add(feltBed);

    const cushionMat = new THREE.MeshStandardMaterial({ color: 0x093317, roughness: 0.3 });

    const cusNorth = new THREE.Mesh(new THREE.BoxGeometry(w + cushionThick*2, heightLevel, cushionThick), cushionMat);
    cusNorth.position.set(0, heightLevel/2 - 0.1, -h/2 - cushionThick/2);
    tableGroup.add(cusNorth);

    const cusSouth = new THREE.Mesh(new THREE.BoxGeometry(w + cushionThick*2, heightLevel, cushionThick), cushionMat);
    cusSouth.position.set(0, heightLevel/2 - 0.1, h/2 + cushionThick/2);
    tableGroup.add(cusSouth);

    const cusEast = new THREE.Mesh(new THREE.BoxGeometry(cushionThick, heightLevel, h), cushionMat);
    cusEast.position.set(w/2 + cushionThick/2, heightLevel/2 - 0.1, 0);
    tableGroup.add(cusEast);

    const cusWest = new THREE.Mesh(new THREE.BoxGeometry(cushionThick, heightLevel, h), cushionMat);
    cusWest.position.set(-w/2 - cushionThick/2, heightLevel/2 - 0.1, 0);
    tableGroup.add(cusWest);

    const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2a18, roughness: 0.2 });

    const frameNorth = new THREE.Mesh(new THREE.BoxGeometry(w + (cushionThick + woodThick)*2, heightLevel, woodThick), woodMat);
    frameNorth.position.set(0, heightLevel/2 - 0.1, -h/2 - cushionThick - woodThick/2);
    tableGroup.add(frameNorth);

    const frameSouth = new THREE.Mesh(new THREE.BoxGeometry(w + (cushionThick + woodThick)*2, heightLevel, woodThick), woodMat);
    frameSouth.position.set(0, heightLevel/2 - 0.1, h/2 + cushionThick + woodThick/2);
    tableGroup.add(frameSouth);

    const frameEast = new THREE.Mesh(new THREE.BoxGeometry(woodThick, heightLevel, h + cushionThick*2), woodMat);
    frameEast.position.set(w/2 + cushionThick + woodThick/2, heightLevel/2 - 0.1, 0);
    tableGroup.add(frameEast);

    const frameWest = new THREE.Mesh(new THREE.BoxGeometry(woodThick, heightLevel, h + cushionThick*2), woodMat);
    frameWest.position.set(-w/2 - cushionThick - woodThick/2, heightLevel/2 - 0.1, 0);
    tableGroup.add(frameWest);

    const legGeo = new THREE.CylinderGeometry(1.2, 0.8, 10, 16);
    const legPositions = [
        [-w/2 - 0.5, -5.2, -h/2 - 0.5], [w/2 + 0.5, -5.2, -h/2 - 0.5],
        [-w/2 - 0.5, -5.2, h/2 + 0.5], [w/2 + 0.5, -5.2, h/2 + 0.5]
    ];
    legPositions.forEach(pos => {
        const leg = new THREE.Mesh(legGeo, woodMat);
        leg.position.set(...pos);
        tableGroup.add(leg);
    });

    const pointMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pointGeo = new THREE.SphereGeometry(0.12, 12, 12);
    const surfaceY = heightLevel - 0.1 + 0.01;
    const pointOffsetZ = h/2 + cushionThick + woodThick/2;
    const pointOffsetX = w/2 + cushionThick + woodThick/2;

    for(let i = 0; i <= 8; i++) {
        let x = -w/2 + (w/8) * i;
        let p1 = new THREE.Mesh(pointGeo, pointMat); p1.position.set(x, surfaceY, -pointOffsetZ); tableGroup.add(p1);
        let p2 = new THREE.Mesh(pointGeo, pointMat); p2.position.set(x, surfaceY, pointOffsetZ); tableGroup.add(p2);
    }
    for(let j = 0; j <= 4; j++) {
        let z = -h/2 + (h/4) * j;
        let p1 = new THREE.Mesh(pointGeo, pointMat); p1.position.set(pointOffsetX, surfaceY, z); tableGroup.add(p1);
        let p2 = new THREE.Mesh(pointGeo, pointMat); p2.position.set(-pointOffsetX, surfaceY, z); tableGroup.add(p2);
    }

    scene.add(tableGroup);
}

function createCueStick() {
    cuePivot = new THREE.Group();
    scene.add(cuePivot);

    cueGroup = new THREE.Group();

    const tipGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.1, 16);
    tipGeo.rotateX(Math.PI / 2);
    tipGeo.translate(0, 0, 0.05);
    const tipMat = new THREE.MeshStandardMaterial({ color: 0x1f3a52, roughness: 0.9 });
    const tipMesh = new THREE.Mesh(tipGeo, tipMat);
    cueGroup.add(tipMesh);

    const ferruleGeo = new THREE.CylinderGeometry(0.052, 0.055, 0.25, 16);
    ferruleGeo.rotateX(Math.PI / 2);
    ferruleGeo.translate(0, 0, 0.225);
    const ferruleMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f0, roughness: 0.2 });
    cueGroup.add(new THREE.Mesh(ferruleGeo, ferruleMat));

    const shaftGeo = new THREE.CylinderGeometry(0.055, 0.1, 7.15, 16);
    shaftGeo.rotateX(Math.PI / 2);
    shaftGeo.translate(0, 0, 3.925);
    const shaftMat = new THREE.MeshStandardMaterial({ color: 0xf3e5ab, roughness: 0.4 });
    cueGroup.add(new THREE.Mesh(shaftGeo, shaftMat));

    const ringGeo = new THREE.CylinderGeometry(0.102, 0.102, 0.15, 16);
    ringGeo.rotateX(Math.PI / 2);
    ringGeo.translate(0, 0, 7.575);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
    cueGroup.add(new THREE.Mesh(ringGeo, ringMat));

    const buttGeo = new THREE.CylinderGeometry(0.102, 0.15, 7.35, 16);
    buttGeo.rotateX(Math.PI / 2);
    buttGeo.translate(0, 0, 11.325);
    const buttMat = new THREE.MeshStandardMaterial({ color: 0x2b1810, roughness: 0.3 });
    const buttMesh = new THREE.Mesh(buttGeo, buttMat);

    const patternMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.6, roughness: 0.3 });
    [9.5, 12.0, 14.2].forEach(zPos => {
        const pRingGeo = new THREE.CylinderGeometry(0.12, 0.13, 0.2, 16);
        pRingGeo.rotateX(Math.PI / 2);
        pRingGeo.translate(0, 0, zPos);
        cueGroup.add(new THREE.Mesh(pRingGeo, patternMat));
    });

    cueGroup.add(buttMesh);
    cuePivot.add(cueGroup);
}

function createBalls() {
    balls.forEach(b => scene.remove(b));
    balls = [];

    const r = tableSpec.ballR;
    const geo = new THREE.SphereGeometry(r, 32, 32);

    cueBall = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }));
    objectBall1 = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xcc1111, roughness: 0.1 }));
    objectBall2 = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.1 }));

    balls = [cueBall, objectBall1, objectBall2];

    if (currentGameMode === '4ball') {
        objectBall3 = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xcc1111, roughness: 0.1 }));
        balls.push(objectBall3);
    }

    balls.forEach(b => {
        b.userData = { vx: 0, vz: 0, spinX: 0, spinY: 0 };
        scene.add(b);
    });

    resetBalls(true);
}

function createAimLines() {
    aimLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.5, gapSize: 0.2 }));
    scene.add(aimLine);
    theoryLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xf39c12 }));
    scene.add(theoryLine);
}

function resetBalls(isRandom = false) {
    isSimulating = false;
    isReplaying = false;
    recordedFrames = [];
    document.getElementById('btnReplay').disabled = true;
    clearTrails();

    const w = tableSpec.width, h = tableSpec.height;
    const r = tableSpec.ballR;
    const margin = r * 3;
    const minX = -w/2 + margin, maxX = w/2 - margin;
    const minZ = -h/2 + margin, maxZ = h/2 - margin;

    if (isRandom || savedBallPositions.length !== balls.length) {
        savedBallPositions = [];
        balls.forEach(() => {
            let posX, posZ, valid;
            let attempts = 0;
            do {
                valid = true;
                posX = minX + Math.random() * (maxX - minX);
                posZ = minZ + Math.random() * (maxZ - minZ);
                for (let p of savedBallPositions) {
                    if (Math.hypot(posX - p.x, posZ - p.z) < r * 2.8) {
                        valid = false;
                        break;
                    }
                }
                attempts++;
            } while (!valid && attempts < 300);

            savedBallPositions.push({ x: posX, z: posZ });
        });
    }

    balls.forEach((ball, idx) => {
        if (savedBallPositions[idx]) {
            ball.position.set(savedBallPositions[idx].x, r, savedBallPositions[idx].z);
        }
        ball.userData.vx = 0;
        ball.userData.vz = 0;
    });

    updateAimLine();
}

function changeGameMode() {
    currentGameMode = document.getElementById('gameMode').value;
    const tableTypeSelect = document.getElementById('tableType');

    if (currentGameMode === '4ball') {
        tableTypeSelect.value = 'joongdae';
        tableSpec = { width: 24.4, height: 12.2, ballR: 0.3275, friction: 0.984, cushionElasticity: 0.73 };
    } else {
        tableTypeSelect.value = 'daeda';
        tableSpec = { width: 28.44, height: 14.22, ballR: 0.3075, friction: 0.991, cushionElasticity: 0.82 };
    }

    buildTable();
    createBalls();
}

function changeTableType() {
    const type = document.getElementById('tableType').value;
    const ballR = (currentGameMode === '4ball') ? 0.3275 : 0.3075;
    tableSpec = (type === 'daeda') 
        ? { width: 28.44, height: 14.22, ballR: ballR, friction: 0.991, cushionElasticity: 0.82 } 
        : { width: 24.4, height: 12.2, ballR: ballR, friction: 0.984, cushionElasticity: 0.73 };
    buildTable(); 
    createBalls();
}

function updateAngleLabel(val) {
    document.getElementById('angleVal').innerText = parseFloat(val).toFixed(1) + '°';
}

function adjustAngle(delta) {
    let slider = document.getElementById('aimAngle');
    let current = parseFloat(slider.value) || 0;
    let next = (current + delta + 360) % 360;
    slider.value = next.toFixed(1);
    updateAngleLabel(slider.value);
    updateAimLine();
}

function updateAimLine() {
    if (!cuePivot || !cueBall || !aimLine) return;

    if (isSimulating || isReplaying) {
        cuePivot.visible = false;
        aimLine.visible = false;
        theoryLine.visible = false;
        return;
    }
    cuePivot.visible = true;
    aimLine.visible = true;
    theoryLine.visible = true;

    const angleDeg = parseFloat(document.getElementById('aimAngle').value);
    const rad = (angleDeg * Math.PI) / 180;

    cuePivot.position.copy(cueBall.position);
    cuePivot.rotation.y = -rad - Math.PI / 2;

    cueGroup.position.set(0, 0.08, 0.2);
    cueGroup.rotation.x = -0.08; 

    const aimDir = new THREE.Vector3(Math.cos(rad), 0, Math.sin(rad));

    const p1 = cueBall.position.clone();
    p1.y = tableSpec.ballR;

    const p2 = p1.clone().add(aimDir.clone().multiplyScalar(40));
    p2.y = tableSpec.ballR;

    aimLine.geometry.setFromPoints([p1, p2]);
    if (aimLine.computeLineDistances) aimLine.computeLineDistances();

    calculateThickness(rad);
}

// 조준선 상의 모든 목적구 실시간 정밀 겨냥 감지 로직
function calculateThickness(rad) {
    if (!cueBall || !balls || balls.length === 0) return;

    const thicknessEl = document.getElementById('thicknessVal');
    if (!thicknessEl) return;

    const dirX = Math.cos(rad);
    const dirZ = Math.sin(rad);
    const maxDist = tableSpec.ballR * 2;

    let closestHit = null;
    let minT = Infinity;

    // 수구를 제외한 모든 공 충돌 탐색
    balls.forEach(ball => {
        if (ball === cueBall) return;

        const dx = ball.position.x - cueBall.position.x;
        const dz = ball.position.z - cueBall.position.z;
        const t = dx * dirX + dz * dirZ; // 조준 방향 전방 거리

        if (t > 0) {
            const vDistSq = (dx * dx + dz * dz) - (t * t);
            const vDist = Math.sqrt(Math.max(0, vDistSq));

            if (vDist < maxDist && t < minT) {
                minT = t;
                closestHit = {
                    ball: ball,
                    vDist: vDist
                };
            }
        }
    });

    if (!closestHit) {
        thicknessEl.innerText = "조준선에 맞는 공 없음";
        thicknessEl.style.color = "#888";
        return;
    }

    // 겨냥된 공 이름/색상 확인
    let ballName = "목적구";
    let ballColorHex = closestHit.ball.material.color.getHex();
    if (ballColorHex === 0xcc1111) {
        ballName = "🔴 빨간 공";
    } else if (ballColorHex === 0xf1c40f) {
        ballName = "🟡 노란 공";
    }

    const overlap = 1 - (closestHit.vDist / maxDist);
    let thickText = "";
    let color = "#2ecc71";

    if (overlap >= 0.9375) { thickText = "8/8 두께 (100% 정면)"; color = "#e74c3c"; }
    else if (overlap >= 0.8125) { thickText = "7/8 두께"; color = "#e67e22"; }
    else if (overlap >= 0.6875) { thickText = "6/8 두께 (3/4 두께)"; color = "#f1c40f"; }
    else if (overlap >= 0.5625) { thickText = "5/8 두께"; color = "#f39c12"; }
    else if (overlap >= 0.4375) { thickText = "4/8 두께 (1/2 반두께)"; color = "#2ecc71"; }
    else if (overlap >= 0.3125) { thickText = "3/8 두께"; color = "#1abc9c"; }
    else if (overlap >= 0.1875) { thickText = "2/8 두께 (1/4 두께)"; color = "#3498db"; }
    else if (overlap >= 0.09375) { thickText = "1/8 두께"; color = "#9b59b6"; }
    else if (overlap >= 0.02) { thickText = "0.5/8 두께 (얇게)"; color = "#e84393"; }
    else { thickText = "스침 (얇게)"; color = "#888"; }

    thicknessEl.innerText = `${ballName} : ${thickText}`;
    thicknessEl.style.color = color;
}

function onPointerDown(event) {
    pointerStartX = event.clientX;
    pointerStartY = event.clientY;
}

function onPointerUp(event) {
    if (isSimulating || isReplaying || event.button !== 0) return;

    const moveDistance = Math.hypot(event.clientX - pointerStartX, event.clientY - pointerStartY);

    if (moveDistance < 6) {
        const viewport = document.getElementById('viewport');
        const rect = viewport.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / viewport.clientWidth) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / viewport.clientHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const targetPoint = new THREE.Vector3();

        if (raycaster.ray.intersectPlane(plane, targetPoint)) {
            const dx = targetPoint.x - cueBall.position.x;
            const dz = targetPoint.z - cueBall.position.z;
            let deg = Math.atan2(dz, dx) * (180 / Math.PI);
            if (deg < 0) deg += 360;

            let formattedDeg = parseFloat(deg.toFixed(1));
            document.getElementById('aimAngle').value = formattedDeg;
            updateAngleLabel(formattedDeg);
            updateAimLine();
        }
    }
}

function shoot() {
    if (isSimulating || isReplaying) return;
    
    recordedFrames = [];
    document.getElementById('btnReplay').disabled = true;

    const power = parseFloat(document.getElementById('power').value) * 0.08;
    const rad = (parseFloat(document.getElementById('aimAngle').value) * Math.PI) / 180;

    cueBall.userData.vx = Math.cos(rad) * power;
    cueBall.userData.vz = Math.sin(rad) * power;
    cueBall.userData.spinX = parseFloat(document.getElementById('spinX').value);
    cueBall.userData.spinY = parseFloat(document.getElementById('spinY').value);

    isSimulating = true;
    updateAimLine();
}

function updatePhysics() {
    if (!isSimulating) return;
    let moving = false;

    const currentFrame = balls.map(b => ({ x: b.position.x, y: b.position.y, z: b.position.z }));
    recordedFrames.push(currentFrame);

    balls.forEach(ball => {
        let vX = ball.userData.vx, vZ = ball.userData.vz;
        if (Math.hypot(vX, vZ) > 0.001) {
            moving = true;
            createTrailPoint(ball.position.clone(), ball.material.color);
            ball.position.x += vX; ball.position.z += vZ;
            ball.userData.vx *= tableSpec.friction; ball.userData.vz *= tableSpec.friction;

            const wB = tableSpec.width/2 - tableSpec.ballR, hB = tableSpec.height/2 - tableSpec.ballR;
            if (Math.abs(ball.position.x) > wB) {
                ball.position.x = Math.sign(ball.position.x) * wB;
                ball.userData.vx = -ball.userData.vx * tableSpec.cushionElasticity;
            }
            if (Math.abs(ball.position.z) > hB) {
                ball.position.z = Math.sign(ball.position.z) * hB;
                ball.userData.vz = -ball.userData.vz * tableSpec.cushionElasticity;
            }
        }
    });

    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            checkBallCollision(balls[i], balls[j]);
        }
    }

    if (!moving) {
        isSimulating = false;
        if (recordedFrames.length > 0) {
            document.getElementById('btnReplay').disabled = false;
        }
        updateAimLine();
    }
}

function playSlowReplay() {
    if (recordedFrames.length === 0 || isSimulating || isReplaying) return;
    
    clearTrails();
    isReplaying = true;
    replayFrameIdx = 0;
    updateAimLine();
}

function updateReplay() {
    if (!isReplaying) return;

    let idx = Math.floor(replayFrameIdx);
    if (idx >= recordedFrames.length) {
        isReplaying = false;
        updateAimLine();
        return;
    }

    const frame = recordedFrames[idx];
    for (let i = 0; i < balls.length; i++) {
        if (frame[i]) {
            balls[i].position.set(frame[i].x, frame[i].y, frame[i].z);
            createTrailPoint(balls[i].position.clone(), balls[i].material.color);
        }
    }

    replayFrameIdx += REPLAY_SPEED;
}

function checkBallCollision(b1, b2) {
    const dx = b2.position.x - b1.position.x;
    const dz = b2.position.z - b1.position.z;
    const dist = Math.hypot(dx, dz);
    const minDist = tableSpec.ballR * 2;

    if (dist < minDist) {
        const angle = Math.atan2(dz, dx);
        const sin = Math.sin(angle), cos = Math.cos(angle);

        let vx1 = b1.userData.vx * cos + b1.userData.vz * sin;
        let vz1 = b1.userData.vz * cos - b1.userData.vx * sin;
        let vx2 = b2.userData.vx * cos + b2.userData.vz * sin;
        let vz2 = b2.userData.vz * cos - b2.userData.vx * sin;

        b1.userData.vx = vx2 * cos - vz1 * sin;
        b1.userData.vz = vz1 * cos + vx2 * sin;
        b2.userData.vx = vx1 * cos - vz2 * sin;
        b2.userData.vz = vz2 * cos + vx1 * sin;

        const overlap = minDist - dist;
        b1.position.x -= Math.cos(angle) * overlap / 2;
        b1.position.z -= Math.sin(angle) * overlap / 2;
        b2.position.x += Math.cos(angle) * overlap / 2;
        b2.position.z += Math.sin(angle) * overlap / 2;
    }
}

function createTrailPoint(pos, color) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.5 }));
    mesh.position.copy(pos);
    scene.add(mesh);
    ballTrails.push(mesh);
    if (ballTrails.length > 400) scene.remove(ballTrails.shift());
}

function clearTrails() {
    ballTrails.forEach(p => scene.remove(p));
    ballTrails = [];
}

function updateSystemHUD() {
    const mode = document.getElementById('systemMode').value;
    const t = document.getElementById('sysTitle'), f = document.getElementById('sysFormula');
    if (mode === 'fiveHalf') { t.innerText = "파이브 앤 하프 시스템"; f.innerHTML = '공식: <span class="formula">1쿠션 = 수구 수 - 3쿠션 수</span>'; }
    else if (mode === 'plus') { t.innerText = "플러스 시스템"; f.innerHTML = '공식: <span class="formula">1쿠션 = 수구 수 + 3쿠션 수</span>'; }
    else { t.innerText = "기본 가이드 모드"; f.innerHTML = '공식: <span class="formula">입사각 = 반사각</span>'; }
}

function updatePowerLabel(v) {
    v = parseFloat(v);
    let railTxt = "";
    if (v <= 10) railTxt = "(1레일 세기)";
    else if (v <= 18) railTxt = "(2레일 세기)";
    else railTxt = "(3레일 이상 세기)";
    document.getElementById('powVal').innerText = v + " m/s " + railTxt;
}

function updateSpinXLabel(v) {
    v = parseFloat(v);
    let valAbs = Math.abs(v);
    let txt = "";
    if (v < 0) txt = "좌 " + valAbs + " Tip";
    else if (v > 0) txt = "우 " + valAbs + " Tip";
    else txt = "0 Tip (중앙)";
    document.getElementById('spinXVal').innerText = txt;
}

function updateSpinYLabel(v) {
    v = parseFloat(v);
    let txt = "";
    if (v > 0) txt = "상단 " + v + " Tip (Follow)";
    else if (v < 0) txt = "하단 " + Math.abs(v) + " Tip (Draw)";
    else txt = "0 Tip (중앙)";
    document.getElementById('spinYVal').innerText = txt;
}

function onWindowResize() {
    const viewport = document.getElementById('viewport');
    const w = viewport.clientWidth, h = viewport.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
}

function animate() {
    requestAnimationFrame(animate);
    
    if (isSimulating) {
        updatePhysics();
    } else if (isReplaying) {
        updateReplay();
    }

    if(controls) controls.update();
    renderer.render(scene, camera);
}

window.onload = function() {
    init3D();
};
</script>
</body>
